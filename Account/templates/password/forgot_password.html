<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6">
        Forgot Password
    </h2>


    <form method="POST" id="forgotPasswordForm" action="{% url 'forgot_password' %}">
        {% csrf_token %}

        

        <label class="block mb-2 font-medium">
            Email
        </label>

        <input
            type="email"
            name="email"
            required
            class="w-full border rounded-lg p-3 mb-5">
            {% if form.email.errors %}
                <div class="text-red-500 text-sm font-medium mt-1 mb-4">
                    {{ form.email.errors.0 }}
                </div>
            {% endif %}

        <div class="w-full">
             <button id="otpButton" type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg font-medium transition duration-200 cursor-pointer">
                Send OTP
            </button>

        
            <div id="successMessage" class="hidden mt-3 text-center text-sm font-semibold text-green-600 bg-green-50 p-3 rounded-lg border border-green-200">
                 Mail has been sent successfully!
            </div>
        </div>
        <!-- <button
            class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg">
            Send OTP
        </button> -->

    </form>

</div>

</body>
</html>




<script>
function handleOtpSend() {
    const button = document.getElementById('otpButton');
    const successMsg = document.getElementById('successMessage');

    button.disabled = true;
    button.innerText = "Sending...";
    button.classList.add('opacity-50', 'cursor-not-allowed');
    
    setTimeout(() => {
        button.innerText = "OTP Sent";
        successMsg.classList.remove('hidden');
        
        setTimeout(() => {
            window.location.href = "{% url 'verify_otp' %}"; 
        }, 2000); 

    }, 1500); 
}

</script>
