<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

    <h2 class="text-2xl font-bold text-center mb-6">
        Verify OTP
    </h2>

    <form method="POST">
        {% csrf_token %}

        <label class="block mb-2 font-medium">
            Enter OTP
        </label>

        <input
            type="text"
            name="otp"
            maxlength="6"
            required
            class="w-full border rounded-lg p-3 mb-5 text-center tracking-widest text-xl">

        <button
            class="w-full bg-pink-500 hover:bg-pink-600 text-white py-3 rounded-lg">
            Verify OTP
        </button>

    </form>

</div>

</body>
</html>
