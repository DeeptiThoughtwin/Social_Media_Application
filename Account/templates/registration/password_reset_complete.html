{% extends 'registration/base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="text-center font-serif m-4 p-4">
    <h2 class="text-green-500 text-2xl mb-8">Password Reset Successful!</h2>
    <div class="text-lg p-4">
    <p>Your password has been successfully changed.</p>
    <p>You can now log in with your new password.</p>
    
    <button class="p-2 px-4 text-white rounded-2xl text-xs m-4 bg-gradient-to-r from-purple-400 via-pink-400 to-red-500 ">
        <a href="{% url 'login' %}" class="btn btn-primary">Log In</a>
    </button>
</div>
{% endblock %}
