{% extends 'base.html' %}

{% block content %}



<div class="max-w-xl mx-auto mt-10">
    <div class="bg-white shadow-lg rounded-2xl p-6">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Create New Post
        </h2>
        {% if form.non_field_errors %}
        <div class="mb-4 rounded-lg bg-red-100 border border-red-400 text-red-700 px-4 py-3">
            {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="text-sm font-medium text-gray-600">Caption</label>
                <textarea
                    name="caption"
                    rows="4"
                    placeholder="Write something amazing..."
                    class="w-full mt-1 border rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400"
                ></textarea>
            </div>
            <div>
                <label class="text-sm font-medium text-gray-600">
                    Upload Images or Videos
                </label>

                <div class="mt-2 border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-pink-400 transition">
                    <input
                        type="file"
                        name="files"
                        multiple
                        accept="image/*,video/*"
                        class="w-full text-sm">

                </div>
                <small class="text-red-600">upload atleast one image/video*.</small>
            </div>
            <button
                type="submit"
                class="w-full bg-pink-500 text-white py-2 rounded-xl font-semibold hover:bg-pink-600 transition">
                Post
            </button>
        </form>
    </div>
</div>



{% endblock %}
