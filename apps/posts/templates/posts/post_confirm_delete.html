{% extends 'base.html' %}

{% block content %}


<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <div class="flex justify-center mb-4">
            <div class="w-16 h-16 rounded-full bg-red-100 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="w-8 h-8 text-red-600"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M6 7h12M9 7V4h6v3m-8 0l1 13h8l1-13"/>
                </svg>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-center text-gray-800">
            Delete Post
        </h2>

        <p class="mt-3 text-center text-gray-600">
            Are you sure you want to delete this post?
            <br>
            <span class="text-red-500 font-medium">
                This action cannot be undone.
            </span>
        </p>

        <form method="POST" class="mt-8 flex gap-4">
            {% csrf_token %}

            <a href="{% url 'profile' %}"
               class="flex-1 text-center py-3 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
                Cancel
            </a>

            <button type="submit"
                    class="flex-1 py-3 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition">
                Delete
            </button>
        </form>

    </div>
</div>

{% endblock %}
