<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories</title>

    
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">        
        <h1 class="text-3xl font-bold mb-6">All Stories</h1>     
        <div class="bg-white rounded-xl shadow-md p-5">
            <div class="flex items-center gap-6 overflow-x-auto">
                {% for story in stories %}
                    <div class="text-center flex-shrink-0">                      
                        {% if story.image %}
                        <img
                            src="{{ story.image.url }}"
                            class="w-20 h-20 rounded-full border-4 border-pink-500 object-cover"
                            alt="story image"
                        >
                        {% else %}
                        <div class="w-20 h-20 rounded-full bg-gray-300 flex items-center justify-center">
                            No Image
                        </div>
                        {% endif %}
                       <p class="text-xs mt-2 text-gray-700">
                            {{ story.user.username }}
                        </p>
                    </div>
                {% empty %}
                    <p class="text-gray-500">No stories available</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
