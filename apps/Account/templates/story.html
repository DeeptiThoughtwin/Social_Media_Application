{% extends 'base.html' %}

{% block content %}
<div class="bg-white rounded-xl shadow-md p-4 mb-8">

    <div class="flex items-center gap-5 overflow-x-auto">

        
        <div class="text-center flex-shrink-0">
            <button type="button" onclick="openStoryModal()">
                <div class="w-20 h-20 rounded-full border-4 border-pink-500 flex items-center justify-center text-4xl hover:bg-pink-100">
                    +
                </div>
            </button>
            <p class="text-xs mt-2 text-gray-700">Add</p>
        </div>

       
            {% for story in stories %}
                <div class="text-center flex-shrink-0">
                    <img
                        src="{{ story.image.url }}"
                        onclick="openStory(
                            '{{ story.id }}',
                            '{{ story.image.url }}',
                            {% if story.user == request.user %}true{% else %}false{% endif %}
                        )"
                        class="w-20 h-20 rounded-full border-4 border-pink-500 object-cover cursor-pointer"
                        alt="story"
                    >
                    {% if story.user == request.user %}
                        <p class="text-xs mt-2 text-gray-700">
                            Your Story
                        </p>
                    {% else %}
                        <p class="text-xs mt-2 text-gray-700">
                            {{ story.user.username }}
                        </p>
                    {% endif %}
                </div>
        {% endfor %}


    </div>
</div>

<div id="storyModal" class="hidden fixed inset-0 bg-black/70 justify-center items-center z-50">
    <div class="bg-white rounded-xl w-96 p-6">
       <h2 class="text-xl text-serif text-center text-pink-500 font-bold mb-5">Add Story</h2>
        <form method="POST" action="{% url 'add_story' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="image" id="id_image" class="hidden" required>
            <label for="id_image"
                   class="cursor-pointer block border-2 border-solid border-pink-500 rounded-lg p-8 text-center">
                Choose Story Image
            </label>
           <img id="previewImage" class="hidden mt-5 rounded-lg w-full h-64 object-cover">
            <div class="flex justify-between mt-6">
                <button type="button" onclick="closeStoryModal()"
                        class="bg-pink-200 px-4 py-2 rounded">
                    Cancel
                </button>
                <button type="submit"
                        class="bg-gradient-to-r from-pink-500 to-orange-400  text-white px-4 py-2 rounded">
                    Upload
                </button>
            </div>
        </form>
    </div>
</div>


<div id="storyPopup" class="hidden fixed inset-0 bg-black/90 justify-center items-center z-50">
    <div class="relative">
        <button onclick="closeStory()"
                class="absolute -top-2 right-0 text-white text-5xl">
            &times;
        </button>
        <img id="storyImage" class="max-h-[70vh] max-w-[120vw] rounded-xl">
        <a id="deleteStoryBtn"
           class="hidden mt-4 w-full bg-red-500 hover:bg-red-600 text-white text-center py-2 rounded-lg block">
            Delete Story
        </a>
    </div>
</div>











<script>
function openStoryModal() {
    const modal = document.getElementById("storyModal");
    modal.classList.remove("hidden");
    modal.classList.add("flex");
}

function closeStoryModal() {
    const modal = document.getElementById("storyModal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
}

function openStory(id, image, isOwner) {
    document.getElementById("storyImage").src = image;

    const popup = document.getElementById("storyPopup");
    popup.classList.remove("hidden");
    popup.classList.add("flex");

    const deleteBtn = document.getElementById("deleteStoryBtn");

    if (isOwner) {
        deleteBtn.href = "/stories/delete/" + id + "/";
        deleteBtn.classList.remove("hidden");
    } else {
        deleteBtn.classList.add("hidden");
    }
}

function closeStory() {
    const popup = document.getElementById("storyPopup");
    popup.classList.add("hidden");
    popup.classList.remove("flex");
}


document.addEventListener("DOMContentLoaded", function () {
    const imageInput = document.getElementById("id_image");

    if (imageInput) {
        imageInput.addEventListener("change", function () {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    const preview = document.getElementById("previewImage");
                    preview.src = e.target.result;
                    preview.classList.remove("hidden");
                };

                reader.readAsDataURL(file);
            }
        });
    }
});
</script>

{% endblock %}
