<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %} Base HTML Page{% endblock title %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<body>

  {% block content %}


  {% if messages %}
<div class="max-w-4xl mx-auto mt-4">
    {% for message in messages %}
        <div class="mb-3 rounded-lg bg-green-100 border border-green-300 text-green-700 px-4 py-3">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
  
 

  {% endblock content %}
</body>
</html>
